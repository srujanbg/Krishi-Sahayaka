<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#166534">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Krishi Sahayaka">
<title>Krishi Sahayaka · Karnataka Farmer Assistant</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Krishi Sahayaka — Karnataka Farmer Assistant","short_name":"Krishi Sahayaka","display":"standalone","background_color":"%23052e16","theme_color":"%23166534","start_url":"./KrishiSahayaka.html","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23166534%22/%3E%3Ctext x=%2250%22 y=%2270%22 font-size=%2258%22 text-anchor=%22middle%22%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml"}]}'>
<style>
  :root{
    --bg:#f0fdf4; --card:#ffffff; --text:#0f172a; --muted:#64748b;
    --accent:#166534; --accent2:#16a34a; --soft:#dcfce7; --border:#e2e8f0;
    --ok:#15803d; --okbg:#dcfce7; --warn:#b45309; --warnbg:#fef3c7;
    --sky:#0284c7; --skybg:#e0f2fe; --amber:#d97706; --shadow:0 4px 16px rgba(22,101,52,.08);
  }
  [data-theme="dark"]{
    --bg:#052e16; --card:#0f2e1c; --text:#ecfdf5; --muted:#94a3b8;
    --accent:#22c55e; --accent2:#4ade80; --soft:#14532d; --border:#1e3a2a;
    --ok:#4ade80; --okbg:#14532d; --warn:#fbbf24; --warnbg:#422006;
    --sky:#38bdf8; --skybg:#0c4a6e; --amber:#fbbf24; --shadow:0 4px 16px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Kannada",sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    transition:background .3s,color .3s;}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 18px 16px;box-shadow:0 2px 12px rgba(0,0,0,.18);}
  .head-row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  header h1{margin:0;font-size:1.3rem;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;}
  header p{margin:3px 0 0;font-size:.78rem;opacity:.9;}
  .head-btns{display:flex;gap:8px;flex-shrink:0;}
  .icon-btn{background:rgba(255,255,255,.2);border:none;color:#fff;font-size:1rem;font-weight:700;height:40px;
    border-radius:20px;cursor:pointer;padding:0 14px;display:flex;align-items:center;gap:5px;}
  .icon-btn.round{width:40px;padding:0;justify-content:center;font-size:1.2rem;}
  .icon-btn:active{background:rgba(255,255,255,.35);}
  .wrap{max-width:620px;margin:0 auto;padding:16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;
    box-shadow:var(--shadow);margin-bottom:16px;}
  .card h2{margin:0 0 14px;font-size:1.02rem;font-weight:700;display:flex;align-items:center;gap:8px;}
  label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin:0 0 6px;}
  .field{margin-bottom:14px;}
  select,input[type=number]{width:100%;padding:12px 13px;font-size:.95rem;border:1px solid var(--border);
    border-radius:11px;background:var(--bg);color:var(--text);outline:none;appearance:none;font-family:inherit;}
  select:focus,input:focus{border-color:var(--accent);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{padding:9px 13px;border:1.5px solid var(--border);border-radius:20px;font-size:.82rem;font-weight:600;
    cursor:pointer;background:var(--bg);color:var(--muted);transition:.15s;user-select:none;}
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn{width:100%;padding:15px;border:none;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow);transition:transform .1s;font-family:inherit;}
  .btn:active{transform:scale(.98);}
  /* tabs */
  .tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex-shrink:0;padding:10px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:.85rem;
    font-weight:700;cursor:pointer;background:var(--card);color:var(--muted);white-space:nowrap;transition:.15s;}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  /* weather */
  .weather{background:linear-gradient(135deg,var(--sky),#0ea5e9);color:#fff;border:none;text-align:center;}
  .weather .big{font-size:3.2rem;line-height:1;margin:6px 0;}
  .weather .temp{font-size:2.4rem;font-weight:800;}
  .weather .cond{font-size:1rem;opacity:.95;margin-top:4px;}
  .wgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px;}
  .wcell{background:rgba(255,255,255,.15);border-radius:12px;padding:10px 6px;}
  .wcell .v{font-size:1.05rem;font-weight:800;}
  .wcell .l{font-size:.68rem;opacity:.9;margin-top:3px;}
  .forecast{display:flex;gap:8px;margin-top:14px;overflow-x:auto;scrollbar-width:none;}
  .forecast::-webkit-scrollbar{display:none;}
  .fday{flex-shrink:0;background:rgba(255,255,255,.15);border-radius:12px;padding:12px 14px;text-align:center;min-width:78px;}
  .fday .d{font-size:.72rem;opacity:.9;} .fday .i{font-size:1.5rem;margin:4px 0;} .fday .t{font-size:.8rem;font-weight:700;}
  .rain-alert{margin-top:14px;background:rgba(255,255,255,.2);border-radius:12px;padding:10px 14px;font-size:.85rem;font-weight:600;}
  /* market */
  .mkt{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
  .mkt:last-child{border-bottom:none;}
  .mkt .name{font-weight:700;font-size:.95rem;}
  .mkt .sub{font-size:.74rem;color:var(--muted);margin-top:2px;}
  .mkt .price{font-size:1.05rem;font-weight:800;color:var(--accent);text-align:right;}
  .mkt .trend{font-size:.72rem;font-weight:700;margin-top:2px;}
  .up{color:var(--ok);} .down{color:#dc2626;}
  /* advisory */
  .adv-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);align-items:flex-start;}
  .adv-row:last-child{border-bottom:none;}
  .adv-ico{font-size:1.4rem;flex-shrink:0;}
  .adv-row .h{font-weight:700;font-size:.9rem;}
  .adv-row .b{font-size:.84rem;color:var(--muted);margin-top:2px;line-height:1.4;}
  /* schemes */
  .scheme{border-left:5px solid var(--accent);}
  .scheme .name{font-weight:700;font-size:.96rem;}
  .scheme .dept{font-size:.72rem;color:var(--muted);margin-top:2px;}
  .scheme .amt{font-size:1.05rem;font-weight:800;color:var(--accent);margin:8px 0 6px;}
  .scheme .desc{font-size:.84rem;color:var(--muted);line-height:1.45;}
  .apply{display:inline-block;margin-top:10px;font-size:.8rem;font-weight:700;color:#fff;background:var(--accent);
    text-decoration:none;padding:8px 16px;border-radius:10px;}
  /* fertilizer */
  .fert-out{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:8px;}
  .fcell{background:var(--soft);border-radius:14px;padding:16px 8px;text-align:center;}
  .fcell .v{font-size:1.5rem;font-weight:800;color:var(--accent);}
  .fcell .l{font-size:.74rem;color:var(--muted);margin-top:4px;font-weight:600;}
  .fnote{font-size:.78rem;color:var(--muted);margin-top:12px;line-height:1.5;text-align:center;}
  .hidden{display:none!important;}
  .disclaimer{font-size:.72rem;color:var(--muted);text-align:center;line-height:1.5;padding:6px 4px 26px;max-width:620px;margin:0 auto;}
</style>
</head>
<body>
<header>
  <div class="head-row">
    <div>
      <h1>🌿 <span data-i18n="appName"></span></h1>
      <p data-i18n="tagline"></p>
    </div>
    <div class="head-btns">
      <button class="icon-btn" id="langBtn" aria-label="Language"></button>
      <button class="icon-btn round" id="themeBtn" aria-label="Theme">🌙</button>
    </div>
  </div>
</header>

<div class="wrap">
  <!-- Farmer inputs -->
  <div class="card">
    <h2>👨‍🌾 <span data-i18n="yourFarm"></span></h2>
    <div class="grid2">
      <div class="field">
        <label data-i18n="district"></label>
        <select id="district"></select>
      </div>
      <div class="field">
        <label data-i18n="crop"></label>
        <select id="crop"></select>
      </div>
    </div>
    <div class="grid2">
      <div class="field">
        <label data-i18n="landSize"></label>
        <input type="number" id="land" min="0" step="0.5" value="2">
      </div>
      <div class="field">
        <label data-i18n="irrigation"></label>
        <select id="irrigation">
          <option value="irrigated" data-i18n-opt="irrigated"></option>
          <option value="rainfed" data-i18n-opt="rainfed"></option>
        </select>
      </div>
    </div>
    <button class="btn" id="goBtn"></button>
  </div>

  <!-- Tabs -->
  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="weather" data-i18n="tab_weather"></div>
    <div class="tab" data-tab="market" data-i18n="tab_market"></div>
    <div class="tab" data-tab="advisory" data-i18n="tab_advisory"></div>
    <div class="tab" data-tab="schemes" data-i18n="tab_schemes"></div>
    <div class="tab" data-tab="fertilizer" data-i18n="tab_fertilizer"></div>
  </div>

  <div id="panel"></div>
</div>

<p class="disclaimer" id="disclaimer"></p>

<script>

let lang = localStorage.getItem('ks_lang') || 'en';
const t = k => I18N[lang][k];

/* =========================================================================
   DATA — districts, crops (bilingual), advisory, schemes, fertilizer rates.
   Everything downstream is computed dynamically from this data.
   ========================================================================= */
const DISTRICTS = [
  {id:"bengaluru", en:"Bengaluru", kn:"ಬೆಂಗಳೂರು"},
  {id:"mysuru", en:"Mysuru", kn:"ಮೈಸೂರು"},

  { id:"ragi", en:"Ragi (Finger millet)", kn:"ರಾಗಿ",
    fert:{urea:45, dap:35, potash:20}, basePrice:3450,

  { id:"paddy", en:"Paddy (Rice)", kn:"ಭತ್ತ",

          water:{en:"Maintain 2–5 cm standing water in field",kn:"ಜಮೀನಿನಲ್ಲಿ 2–5 ಸೆಂ ನೀರು ಕಾಪಾಡಿ"},

          tip:{en:"Drain water 10 days before harvest.",kn:"ಕಟಾವಿಗೆ 10 ದಿನ ಮೊದಲು ನೀರು ಹೊರಬಿಡಿ."} } },
  { id:"maize", en:"Maize", kn:"ಮೆಕ್ಕೆಜೋಳ",
    fert:{urea:60, dap:50, potash:30}, basePrice:2100,
    adv:{ season:{en:"June–July (Kharif), Oct (Rabi)",kn:"ಜೂನ್–ಜುಲೈ, ಅಕ್ಟೋಬರ್"},
          water:{en:"Critical at knee-high, tasseling & grain filling",kn:"ಮೊಣಕಾಲು ಎತ್ತರ, ಟ್ಯಾಸೆಲಿಂಗ್, ಕಾಳು ತುಂಬುವಾಗ ಮುಖ್ಯ"},

/* deterministic pseudo-random so "weather" is stable per district+crop (demo) */
function seeded(str){ let h=0; for(let i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))>>>0;} return ()=>{ h=(h*1103515245+12345)>>>0; return h/4294967296; }; }

/* =========================================================================
   STATE + STATIC RENDER
   ========================================================================= */
let activeTab="weather";

function fillSelect(id, items, getLabel){
  const el=document.getElementById(id); const cur=el.value;
  el.innerHTML=items.map(it=>`<option value="${it.id}">${getLabel(it)}</option>`).join('');
  if(cur) el.value=cur;
}

function renderStatic(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent=t(el.dataset.i18n); });
  document.getElementById('goBtn').textContent=t('go');
  document.getElementById('disclaimer').textContent=t('disclaimer');
  document.getElementById('langBtn').textContent="🌐 "+t('langLabel');
  fillSelect('district', DISTRICTS, it=>it[lang]);
  fillSelect('crop', CROPS, it=>it[lang]);
  // irrigation options
  document.querySelectorAll('#irrigation option').forEach(o=>{ o.textContent=t(o.dataset.i18nOpt); });
}

/* =========================================================================
   COMPUTE + PANELS
   ========================================================================= */
function readFarm(){
  return {
    district: document.getElementById('district').value,
    crop: document.getElementById('crop').value,
    land: Math.max(0, Number(document.getElementById('land').value)||0),
    irrigation: document.getElementById('irrigation').value
  };
}

function weatherData(f){
  const rnd=seeded(f.district+"|"+new Date().toDateString());
  const temp=Math.round(22+rnd()*12);
  const hum=Math.round(45+rnd()*45);
  const wind=Math.round(4+rnd()*18);
  const rain=Math.round(rnd()*100);
  const conds=[["☀️",{en:"Clear",kn:"ಶುಭ್ರ"}],["⛅",{en:"Partly cloudy",kn:"ಭಾಗಶಃ ಮೋಡ"}],
               ["☁️",{en:"Cloudy",kn:"ಮೋಡ"}],["🌦️",{en:"Light showers",kn:"ಹಗುರ ಮಳೆ"}],["🌧️",{en:"Rain",kn:"ಮಳೆ"}]];
  const ci=rain>70?4:rain>50?3:rain>30?1:0;
  const days=lang==='kn'?["ಇಂದು","ನಾಳೆ","ಬುಧ","ಗುರು","ಶುಕ್ರ"]:["Today","Tomorrow","Wed","Thu","Fri"];
  const fc=days.map((d,i)=>{ const r=Math.round(rnd()*100); const c=r>70?"🌧️":r>45?"🌦️":r>25?"⛅":"☀️"; return {d,c,t:Math.round(22+rnd()*12)}; });
  return {temp,hum,wind,rain,cond:conds[ci],fc,willRain:rain>50};
}

function panelWeather(f){
  const w=weatherData(f);
  const dName=DISTRICTS.find(d=>d.id===f.district)[lang];
  return `
  <div class="card weather">
    <div style="font-size:.9rem;opacity:.95;font-weight:600">📍 ${dName}</div>
    <div class="big">${w.cond[0]}</div>
    <div class="temp">${w.temp}°C</div>
    <div class="cond">${w.cond[1][lang]}</div>
    <div class="wgrid">
      <div class="wcell"><div class="v">${w.hum}%</div><div class="l">${t('humidity')}</div></div>
      <div class="wcell"><div class="v">${w.wind} km/h</div><div class="l">${t('wind')}</div></div>
      <div class="wcell"><div class="v">${w.rain}%</div><div class="l">${t('rainChance')}</div></div>
    </div>
    <div style="text-align:left;font-size:.8rem;font-weight:700;margin-top:18px;opacity:.95">${t('forecast5')}</div>
    <div class="forecast">
      ${w.fc.map(d=>`<div class="fday"><div class="d">${d.d}</div><div class="i">${d.c}</div><div class="t">${d.t}°</div></div>`).join('')}
    </div>
    <div class="rain-alert">${w.willRain?t('rainYes'):t('rainNo')}</div>
  </div>`;
}

function panelMarket(f){
  const crop=CROPS.find(c=>c.id===f.crop);
  const rnd=seeded(crop.id+"|mkt|"+new Date().toDateString());
  // build price rows for a handful of markets
  const markets=[
    {en:"Bengaluru APMC",kn:"ಬೆಂಗಳೂರು APMC",fac:1.08},
    {en:"Mysuru APMC",kn:"ಮೈಸೂರು APMC",fac:1.02},
    {en:"Hubballi APMC",kn:"ಹುಬ್ಬಳ್ಳಿ APMC",fac:0.97},
    {en:"Kalaburagi APMC",kn:"ಕಲಬುರಗಿ APMC",fac:0.94}
  ];
  const rows=markets.map(m=>{
    const price=Math.round(crop.basePrice*m.fac*(0.95+rnd()*0.1));
    const change=Math.round((rnd()*8-4)*10)/10;
    const up=change>=0;
    return `<div class="mkt">
      <div><div class="name">${m[lang]}</div><div class="sub">${crop[lang]}</div></div>
      <div><div class="price">₹${price.toLocaleString('en-IN')}<span style="font-size:.7rem;color:var(--muted)">${t('perQuintal')}</span></div>
      <div class="trend ${up?'up':'down'}">${up?'▲':'▼'} ${Math.abs(change)}%</div></div>
    </div>`;
  }).join('');
  return `<div class="card"><h2>💰 ${crop[lang]}</h2>${rows}
    <p style="font-size:.74rem;color:var(--muted);margin:14px 0 0;line-height:1.5">${t('marketNote')}</p></div>`;
}

function panelAdvisory(f){
  const crop=CROPS.find(c=>c.id===f.crop);
  const a=crop.adv;
  const rows=[
    ["📅",t('advSeason'),a.season[lang]],
    ["💧",t('advWater'),a.water[lang]],
    ["🌿",t('advFert'),a.fert[lang]],
    ["🌾",t('advHarvest'),a.harvest[lang]],
    ["💡",t('advTip'),a.tip[lang]]
  ].map(([i,h,b])=>`<div class="adv-row"><div class="adv-ico">${i}</div><div><div class="h">${h}</div><div class="b">${b}</div></div></div>`).join('');
  return `<div class="card"><h2>🌱 ${crop[lang]}</h2>${rows}</div>`;
}

function panelSchemes(){
  const cards=SCHEMES.map(s=>`
    <div class="card scheme">
      <div class="name">${s.name[lang]}</div>
      <div class="dept">${s.dept[lang]}</div>
      <div class="amt">${s.amount[lang]}</div>
      <div class="desc">${s.desc[lang]}</div>
      <a class="apply" href="${s.url}" target="_blank" rel="noopener">${lang==='kn'?'ಅರ್ಜಿ ಸಲ್ಲಿಸಿ →':'Apply →'}</a>
    </div>`).join('');
  return `<div style="font-size:.78rem;color:var(--muted);text-align:center;margin-bottom:12px">${t('schemesNote')}</div>${cards}`;
}

function panelFertilizer(f){
  const crop=CROPS.find(c=>c.id===f.crop);
  const factor=f.irrigation==='rainfed'?0.85:1;   // rain-fed gets slightly less
  const land=f.land||1;
  const urea=Math.round(crop.fert.urea*land*factor);
  const dap=Math.round(crop.fert.dap*land*factor);
  const potash=Math.round(crop.fert.potash*land*factor);
  return `<div class="card">
    <h2>🧮 ${t('fertTitle')}</h2>
    <div style="font-size:.86rem;color:var(--muted);margin-bottom:6px">
      ${t('fertFor')} <strong style="color:var(--text)">${crop[lang]}</strong> · ${land} ${t('acres')} · ${t(f.irrigation)}</div>
    <div class="fert-out">
      <div class="fcell"><div class="v">${urea}</div><div class="l">${t('urea')} (${t('kg')})</div></div>
      <div class="fcell"><div class="v">${dap}</div><div class="l">${t('dap')} (${t('kg')})</div></div>
      <div class="fcell"><div class="v">${potash}</div><div class="l">${t('potash')} (${t('kg')})</div></div>
    </div>
    <p class="fnote">${t('fertNote')}</p>
  </div>`;
}

function renderPanel(){
  const f=readFarm();
  const panel=document.getElementById('panel');
  if(activeTab==='weather') panel.innerHTML=panelWeather(f);
  else if(activeTab==='market') panel.innerHTML=panelMarket(f);
  else if(activeTab==='advisory') panel.innerHTML=panelAdvisory(f);
  else if(activeTab==='schemes') panel.innerHTML=panelSchemes();
  else if(activeTab==='fertilizer') panel.innerHTML=panelFertilizer(f);
}

/* =========================================================================
   EVENTS
   ========================================================================= */
document.getElementById('tabs').addEventListener('click',e=>{
  const tab=e.target.closest('.tab'); if(!tab) return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  tab.classList.add('active'); activeTab=tab.dataset.tab; renderPanel();
});
document.getElementById('goBtn').addEventListener('click',()=>{
  renderPanel();
  document.getElementById('tabs').scrollIntoView({behavior:'smooth',block:'start'});
});
['district','crop','land','irrigation'].forEach(id=>{
  document.getElementById(id).addEventListener('change',renderPanel);
});

document.getElementById('langBtn').onclick=()=>{
  lang=lang==='en'?'kn':'en'; localStorage.setItem('ks_lang',lang);
  renderStatic(); renderPanel();
};

const themeBtn=document.getElementById('themeBtn');
function applyTheme(th){ document.documentElement.setAttribute('data-theme',th);
  themeBtn.textContent=th==='dark'?'☀️':'🌙';
  document.querySelector('meta[name=theme-color]').content=th==='dark'?'#052e16':'#166534'; }
let theme=localStorage.getItem('ks_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
applyTheme(theme);
themeBtn.onclick=()=>{theme=theme==='dark'?'light':'dark';localStorage.setItem('ks_theme',theme);applyTheme(theme);};

/* INIT */
renderStatic();
renderPanel();
</script>
