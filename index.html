  document.getElementById('langBtn').textContent="🌐 "+t('langLabel');
  document.getElementById('hobli').placeholder=lang==='kn'?"ಹೋಬಳಿ ಹೆಸರು":"Hobli name";
  document.getElementById('village').placeholder=lang==='kn'?"ಗ್ರಾಮ ಹೆಸರು":"Village name";
  document.querySelectorAll('#irrigation option').forEach(o=>{ o.textContent=t(o.dataset.i18nOpt); });
  fillDistricts(); fillTaluks(); fillCrop();
}
function readFarm(){ return { district:document.getElementById('district').value, crop:document.getElementById('crop').value, land:Math.max(0,Number(document.getElementById('land').value)||0), irrigation:document.getElementById('irrigation').value }; }
function saveProfile(){ localStorage.setItem('ks_profile', JSON.stringify({ ...readFarm(), taluk:document.getElementById('taluk').value, hobli:document.getElementById('hobli').value, village:document.getElementById('village').value })); }
function weatherData(f){ const rnd=seeded(f.district+"|"+new Date().toDateString());
  const temp=Math.round(22+rnd()*12), hum=Math.round(45+rnd()*45), wind=Math.round(4+rnd()*18), rain=Math.round(rnd()*100);
  const conds=[["☀️",{en:"Clear",kn:"ಶುಭ್ರ"}],["⛅",{en:"Partly cloudy",kn:"ಭಾಗಶಃ ಮೋಡ"}],["☁️",{en:"Cloudy",kn:"ಮೋಡ"}],["🌦️",{en:"Light showers",kn:"ಹಗುರ ಮಳೆ"}],["🌧️",{en:"Rain",kn:"ಮಳೆ"}]];
  const ci=rain>70?4:rain>50?3:rain>30?1:0;
  const days=lang==='kn'?["ಇಂದು","ನಾಳೆ","ಬುಧ","ಗುರು","ಶುಕ್ರ"]:["Today","Tomorrow","Wed","Thu","Fri"];
  const fc=days.map(d=>{ const r=Math.round(rnd()*100); const c=r>70?"🌧️":r>45?"🌦️":r>25?"⛅":"☀️"; return {d,c,t:Math.round(22+rnd()*12)}; });
  return {temp,hum,wind,rain,cond:conds[ci],fc,willRain:rain>50};
}
function panelWeather(f){ const w=weatherData(f); const d=currentDistrict(); const dName=d?d[lang]:'';
  return `<div class="card weather"><div style="font-size:.9rem;opacity:.95;font-weight:600">📍 ${dName}</div>
    <div class="big">${w.cond[0]}</div><div class="temp">${w.temp}°C</div><div class="cond">${w.cond[1][lang]}</div>
    <div class="wgrid"><div class="wcell"><div class="v">${w.hum}%</div><div class="l">${t('humidity')}</div></div>
      <div class="wcell"><div class="v">${w.wind} km/h</div><div class="l">${t('wind')}</div></div>
      <div class="wcell"><div class="v">${w.rain}%</div><div class="l">${t('rainChance')}</div></div></div>
    <div style="text-align:left;font-size:.8rem;font-weight:700;margin-top:18px;opacity:.95">${t('forecast5')}</div>
    <div class="forecast">${w.fc.map(d=>`<div class="fday"><div class="d">${d.d}</div><div class="i">${d.c}</div><div class="t">${d.t}°</div></div>`).join('')}</div>
    <div class="rain-alert">${w.willRain?t('rainYes'):t('rainNo')}</div></div>`;
}
function panelMarket(f){ const crop=CROPS.find(c=>c.id===f.crop); const rnd=seeded(crop.id+"|mkt|"+new Date().toDateString());
  const markets=[{en:"Bengaluru APMC",kn:"ಬೆಂಗಳೂರು APMC",fac:1.08},{en:"Mysuru APMC",kn:"ಮೈಸೂರು APMC",fac:1.02},{en:"Hubballi APMC",kn:"ಹುಬ್ಬಳ್ಳಿ APMC",fac:0.97},{en:"Kalaburagi APMC",kn:"ಕಲಬುರಗಿ APMC",fac:0.94}];
  const rows=markets.map(m=>{ const price=Math.round(crop.basePrice*m.fac*(0.95+rnd()*0.1)); const change=Math.round((rnd()*8-4)*10)/10; return {m,price,change}; });
  const best=rows.reduce((a,b)=>b.price>a.price?b:a);
  const html=rows.sort((a,b)=>b.price-a.price).map(r=>{ const up=r.change>=0; const isBest=r===best;
    return `<div class="mkt ${isBest?'best':''}"><div><div class="name">${r.m[lang]}${isBest?`<span class="best-badge">${t('bestSell')}</span>`:''}</div><div class="sub">${crop[lang]}</div></div>
      <div><div class="price">₹${r.price.toLocaleString('en-IN')}<span style="font-size:.7rem;color:var(--muted)">${t('perQuintal')}</span></div><div class="trend ${up?'up':'down'}">${up?'▲':'▼'} ${Math.abs(r.change)}%</div></div></div>`; }).join('');
  return `<div class="card"><h2>💰 ${crop[lang]}</h2>${html}<p class="muted" style="margin-top:14px">${t('marketNote')}</p></div>`;
}
function advisoryText(f){ const c=CROPS.find(x=>x.id===f.crop); const a=c.adv; return `${c[lang]}. ${t('advSeason')}: ${a.season[lang]}. ${t('advWater')}: ${a.water[lang]}. ${t('advFert')}: ${a.fert[lang]}. ${t('advHarvest')}: ${a.harvest[lang]}. ${t('advTip')}: ${a.tip[lang]}.`; }
function panelAdvisory(f){ const c=CROPS.find(x=>x.id===f.crop); const a=c.adv;
  const rows=[["📅",t('advSeason'),a.season[lang]],["💧",t('advWater'),a.water[lang]],["🌿",t('advFert'),a.fert[lang]],["🌾",t('advHarvest'),a.harvest[lang]],["💡",t('advTip'),a.tip[lang]]]
    .map(([i,h,b])=>`<div class="adv-row"><div class="adv-ico">${i}</div><div><div class="h">${h}</div><div class="b">${b}</div></div></div>`).join('');
  return `<div class="card"><h2>🌱 ${c[lang]}</h2>${rows}<button class="speak" onclick="speak(advisoryText(readFarm()))">${t('listen')}</button></div>`;
}
function panelFertilizer(f){ const c=CROPS.find(x=>x.id===f.crop); const factor=f.irrigation==='rainfed'?0.85:1; const land=f.land||1;
  const urea=Math.round(c.fert.urea*land*factor), dap=Math.round(c.fert.dap*land*factor), potash=Math.round(c.fert.potash*land*factor);
  return `<div class="card"><h2>🧮 ${t('fertTitle')}</h2><div class="muted" style="margin-bottom:6px">${t('fertFor')} <strong style="color:var(--text)">${c[lang]}</strong> · ${land} ${t('acres')} · ${t(f.irrigation)}</div>
    <div class="fert-out"><div class="fcell"><div class="v">${urea}</div><div class="l">${t('urea')} (${t('kg')})</div></div>
      <div class="fcell"><div class="v">${dap}</div><div class="l">${t('dap')} (${t('kg')})</div></div>
      <div class="fcell"><div class="v">${potash}</div><div class="l">${t('potash')} (${t('kg')})</div></div></div><p class="fnote">${t('fertNote')}</p></div>`;
}
function panelSchemes(){ const cards=SCHEMES.map(s=>`<div class="card scheme"><div class="name">${s.name[lang]}</div><div class="dept">${s.dept[lang]}</div><div class="amt">${s.amount[lang]}</div><div class="desc">${s.desc[lang]}</div><a class="apply" href="${s.url}" target="_blank" rel="noopener">${lang==='kn'?'ಅರ್ಜಿ ಸಲ್ಲಿಸಿ →':'Apply →'}</a></div>`).join('');
  return `<div class="muted" style="text-align:center;margin-bottom:12px">${t('schemesNote')}</div>${cards}`; }
function panelHelp(){ return `<div class="card"><h2>📞 ${t('helpTitle')}</h2>
  <div class="helpline"><div style="font-size:1.8rem">☎️</div><div><div style="font-weight:700">${t('kcc')}</div><a href="tel:18001801551" class="n">1800-180-1551</a><div class="muted">${t('kisanNote')}</div></div></div>
  <div style="height:12px"></div>
  <div class="helpline"><div style="font-size:1.8rem">🏛️</div><div><div style="font-weight:700">${t('agriDept')}</div><a href="https://raithamitra.karnataka.gov.in/" target="_blank" rel="noopener" class="n" style="font-size:.95rem">raithamitra.karnataka.gov.in</a></div></div>
  <button class="btn" style="margin-top:16px" onclick="shareApp()">${t('shareApp')}</button></div>`; }
let lastImage=null;
function panelDoctor(){ const syms=[["blight",t('c_blight')],["powdery",t('c_powdery')],["rust",t('c_rust')],["yellowing",t('c_yellowing')],["healthy",t('c_healthy')]];
  return `<div class="card"><h2>🩺 ${t('doctorTitle')}</h2><p class="muted">${t('doctorIntro')}</p>
    <div class="drop" id="drop"><div class="ico">📷</div><div class="txt">${t('dropTxt')}</div><div class="sub">${t('dropSub')}</div></div>
    <input type="file" id="leafInput" accept="image/*" capture="environment" class="hidden">
    <img id="leafPreview" class="preview hidden" alt="leaf">
    <button class="btn hidden" id="analyzeBtn" style="margin-top:12px">${t('analyze')}</button>
    <div id="diagResult"></div>
    <div style="margin-top:18px"><label>${t('orPick')}</label><select id="symptomPick"><option value="">${t('symPrompt')}</option>${syms.map(s=>opt(s[0],s[1])).join('')}</select></div>
    <p class="muted" style="margin-top:14px">${t('doctorDisclaimer')}</p></div>
    <div id="canvasHolder" class="hidden"><canvas id="cv"></canvas></div>`;
}
function classifyPixel(r,g,b){ const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
  if(mx<55) return 'dark';
  if(mx>200 && (mx-mn)<26) return 'white';
  if(r>120 && g>110 && b<g-28 && Math.abs(r-g)<55) return 'yellow';
  if(g>=r && g>=b && (g-b)>18) return 'green';
  if(mx>170 && r>g && g>b && (r-g)>30 && (g-b)>8) return 'orange';
  if(r>=g && g>=b && mx<175) return 'brown';
  return 'other';
}
function analyzeLeaf(){ if(!lastImage) return; const cv=document.getElementById('cv'); const W=140,H=140; cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d'); ctx.drawImage(lastImage,0,0,W,H); const data=ctx.getImageData(0,0,W,H).data;
  const cnt={green:0,yellow:0,brown:0,orange:0,white:0,dark:0,other:0}; let total=0;
  for(let i=0;i<data.length;i+=4*3){ if(data[i+3]<10) continue; cnt[classifyPixel(data[i],data[i+1],data[i+2])]++; total++; }
  if(!total) return; const pct=k=>cnt[k]/total; const green=pct('green');
  const abn={ blight:pct('brown')+pct('dark'), powdery:pct('white'), rust:pct('orange'), yellowing:pct('yellow') };
  let best='healthy',bestVal=0; for(const k in abn){ if(abn[k]>bestVal){ bestVal=abn[k]; best=k; } }
  let condId,conf; if(green>0.72 && bestVal<0.14){ condId='healthy'; conf=Math.min(0.95,green); } else { condId=best; conf=Math.min(0.95,0.35+bestVal*1.6); }
  renderDiagnosis(condId,conf);
}
function renderDiagnosis(condId,conf){ const f=readFarm(); const crop=CROPS.find(c=>c.id===f.crop); const c=CONDITIONS[condId]; const land=f.land||1;
  let doseHtml=''; if(c.dose){ if(condId==='yellowing'){ doseHtml=`<div class="dose">💊 ${c.chemical[lang]} — ${c.dose.qty} ${c.dose.unit[lang]}</div>`; }
    else { const tot=Math.round(c.dose.qty*land); doseHtml=`<div class="dose">💊 ${crop[lang]} · ${land} ${t('acres')}: <strong>${tot} ${lang==='kn'?'ಒಟ್ಟು':'total'}</strong> (${c.dose.qty} ${c.dose.unit[lang]})</div>`; } }
  const sev=c.sev==='ok'?'':(c.sev==='warn'?'warn':'bad'); const pctc=Math.round(conf*100);
  document.getElementById('diagResult').innerHTML=`<div class="card diag ${sev}" style="margin-top:14px"><div class="muted">${t('detected')}</div>
    <div class="cond">${t(c.key)}</div><div class="muted" style="margin-top:8px">${t('confidence')}: ${pctc}%</div>
    <div class="conf-wrap"><div class="conf-bar" style="width:${pctc}%"></div></div>
    <div class="treat"><h4>${t('organic')}</h4><p>${c.organic[lang]}</p><h4>${t('chemical')}</h4><p>${c.chemical[lang]}</p>${doseHtml}
      <h4 style="margin-top:12px">${t('prevention')}</h4><p>${c.prevention[lang]}</p></div>
    <button class="speak" onclick="speak(t(CONDITIONS['${condId}'].key)+'. '+CONDITIONS['${condId}'].organic[lang]+' '+CONDITIONS['${condId}'].chemical[lang]+' '+CONDITIONS['${condId}'].prevention[lang])">${t('listen')}</button></div>`;
  document.getElementById('diagResult').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function wireDoctor(){ const drop=document.getElementById('drop'); if(!drop) return;
  const input=document.getElementById('leafInput'), prev=document.getElementById('leafPreview'), btn=document.getElementById('analyzeBtn'), pick=document.getElementById('symptomPick');
  drop.onclick=()=>input.click();
  input.onchange=e=>{ const file=e.target.files[0]; if(!file) return; const url=URL.createObjectURL(file); const img=new Image(); img.onload=()=>{ lastImage=img; prev.src=url; prev.classList.remove('hidden'); btn.classList.remove('hidden'); }; img.src=url; };
  btn.onclick=analyzeLeaf;
  pick.onchange=e=>{ if(e.target.value) renderDiagnosis(e.target.value,0.6); };
}
function speak(text){ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang=lang==='kn'?'kn-IN':'en-IN'; u.rate=0.95; speechSynthesis.speak(u); }
function shareApp(){ const data={ title:'Krishi Sahayaka', text:t('shareText'), url:location.href }; if(navigator.share){ navigator.share(data).catch(()=>{}); } else { try{navigator.clipboard.writeText(data.text+' '+data.url);}catch(e){} alert((lang==='kn'?'ಲಿಂಕ್ ನಕಲಿಸಲಾಗಿದೆ: ':'Link copied: ')+data.url); } }
let activeTab="weather";
function renderPanel(){ const f=readFarm(); const panel=document.getElementById('panel');
  if(activeTab==='weather') panel.innerHTML=panelWeather(f);
  else if(activeTab==='doctor'){ panel.innerHTML=panelDoctor(); wireDoctor(); }
  else if(activeTab==='market') panel.innerHTML=panelMarket(f);
  else if(activeTab==='advisory') panel.innerHTML=panelAdvisory(f);
  else if(activeTab==='fertilizer') panel.innerHTML=panelFertilizer(f);
  else if(activeTab==='schemes') panel.innerHTML=panelSchemes();
  else if(activeTab==='help') panel.innerHTML=panelHelp();
  saveProfile();
}
document.getElementById('tabs').addEventListener('click',e=>{ const tab=e.target.closest('.tab'); if(!tab) return; document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); tab.classList.add('active'); activeTab=tab.dataset.tab; renderPanel(); });
document.getElementById('goBtn').addEventListener('click',()=>{ renderPanel(); document.getElementById('tabs').scrollIntoView({behavior:'smooth',block:'start'}); });
document.getElementById('district').addEventListener('change',()=>{ fillTaluks(); renderPanel(); });
document.getElementById('taluk').addEventListener('change',saveProfile);
document.getElementById('hobli').addEventListener('input',saveProfile);
document.getElementById('village').addEventListener('input',saveProfile);
['crop','land','irrigation'].forEach(id=>document.getElementById(id).addEventListener('change',renderPanel));
document.getElementById('langBtn').onclick=()=>{ lang=lang==='en'?'kn':'en'; localStorage.setItem('ks_lang',lang); renderStatic(); restoreProfile(); renderPanel(); };
const themeBtn=document.getElementById('themeBtn');
function applyTheme(th){ document.documentElement.setAttribute('data-theme',th); themeBtn.textContent=th==='dark'?'☀️':'🌙'; document.querySelector('meta[name=theme-color]').content=th==='dark'?'#052e16':'#166534'; }
let theme=localStorage.getItem('ks_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'); applyTheme(theme);
themeBtn.onclick=()=>{ theme=theme==='dark'?'light':'dark'; localStorage.setItem('ks_theme',theme); applyTheme(theme); };
function restoreProfile(){ try{ const p=JSON.parse(localStorage.getItem('ks_profile')||'null'); if(!p) return;
  if(p.district){ document.getElementById('district').value=p.district; fillTaluks(); }
  if(p.taluk) document.getElementById('taluk').value=p.taluk;
  if(p.hobli!=null) document.getElementById('hobli').value=p.hobli;
  if(p.village!=null) document.getElementById('village').value=p.village;
  if(p.crop) document.getElementById('crop').value=p.crop;
  if(p.land!=null) document.getElementById('land').value=p.land;
  if(p.irrigation) document.getElementById('irrigation').value=p.irrigation; }catch(e){} }
renderStatic(); restoreProfile(); renderPanel();
</script>
